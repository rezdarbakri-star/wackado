<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Puls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root {
  --bg-root: #0A0A0F;
  --bg-card: rgba(255,255,255,0.025);
  --bg-card-hover: rgba(255,255,255,0.045);
  --bg-input: rgba(255,255,255,0.04);
  --bg-modal: #14141F;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.1);
  --text-1: #E8E8ED;
  --text-2: #888;
  --text-3: #555;
  --text-muted: #333;
  --accent: #6366F1;
  --accent-glow: rgba(99,102,241,0.35);
  --green: #51CF66;
  --green-soft: rgba(81,207,102,0.12);
  --orange: #FF8C42;
  --orange-soft: rgba(255,140,66,0.1);
  --red: #FF4757;
  --red-soft: rgba(255,71,87,0.08);
  --yellow: #FFD43B;
  --yellow-soft: rgba(255,212,59,0.1);
  --overlay: rgba(0,0,0,0.7);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.2);
  --cat-content: #FF6B6B;
  --cat-fitness: #51CF66;
  --cat-hem: #339AF0;
  --cat-personligt: #DA77F2;
  --cat-business: #FFD43B;
  --cat-recovery: #74C0FC;
  --cat-other: #868E96;
  --vacation-gradient: linear-gradient(135deg, #6366F1, #06B6D4);
  --klart-glow: rgba(81,207,102,0.3);
}

[data-theme="light"] {
  --bg-root: #FFF5F7;
  --bg-card: rgba(255,255,255,0.85);
  --bg-card-hover: rgba(255,255,255,1);
  --bg-input: rgba(0,0,0,0.03);
  --bg-modal: #FFFFFF;
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.1);
  --text-1: #3D2C35;
  --text-2: #8E7A85;
  --text-3: #B8A5B0;
  --text-muted: #D4C5CC;
  --accent: #C084A0;
  --accent-glow: rgba(192,132,160,0.3);
  --green: #7BC5A0;
  --green-soft: rgba(123,197,160,0.15);
  --orange: #E8A87C;
  --orange-soft: rgba(232,168,124,0.15);
  --red: #D4798C;
  --red-soft: rgba(212,121,140,0.1);
  --yellow: #E8C87C;
  --yellow-soft: rgba(232,200,124,0.15);
  --overlay: rgba(255,245,247,0.85);
  --shadow-card: 0 2px 16px rgba(140,100,120,0.08);
  --cat-content: #D4798C;
  --cat-fitness: #7BC5A0;
  --cat-hem: #7BAED4;
  --cat-personligt: #B88DC4;
  --cat-business: #D4C07B;
  --cat-recovery: #7BB8D4;
  --cat-other: #A8A0AC;
  --vacation-gradient: linear-gradient(135deg, #C084A0, #7BB8D4);
  --klart-glow: rgba(123,197,160,0.3);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-y:scroll}
body{
  min-height:100%;background:var(--bg-root);font-family:'DM Sans',system-ui,sans-serif;
  color:var(--text-1);-webkit-font-smoothing:antialiased;transition:background 0.4s,color 0.4s;
}
.app{max-width:520px;margin:0 auto;padding:0 16px 100px;position:relative}

/* Header */
.header{padding:env(safe-area-inset-top,12px) 0 0;position:sticky;top:0;z-index:20;background:var(--bg-root);transition:background 0.4s}
.header-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px}
.logo{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;letter-spacing:4px;color:var(--text-1);display:flex;align-items:center;gap:6px}
.logo-icon{font-size:22px}
.subtitle{font-size:12px;color:var(--text-3);letter-spacing:0.5px;margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-toggle{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.theme-toggle:hover{background:var(--bg-card-hover);transform:translateY(-1px)}
.add-btn{height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;white-space:nowrap}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.add-btn span{font-size:20px;line-height:1}

/* Auth bar */
.auth-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;margin-bottom:14px;background:var(--bg-card);border:1px solid var(--border);transition:all 0.3s;gap:10px;flex-wrap:wrap}
.auth-left{display:flex;align-items:center;gap:10px;min-width:0}
.auth-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0}
.auth-name{font-size:13px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-email{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sync-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sync-badge.synced{background:var(--green-soft);color:var(--green)}
.sync-badge.syncing{background:var(--yellow-soft);color:var(--yellow);animation:pulse 1.5s ease infinite}
.sync-badge.offline{background:var(--bg-input);color:var(--text-3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.auth-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-1);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.auth-btn:hover{background:var(--bg-card-hover);transform:translateY(-1px)}
.auth-btn.google{border-color:rgba(66,133,244,0.3);background:rgba(66,133,244,0.08)}
.auth-btn.google:hover{background:rgba(66,133,244,0.15)}
.auth-btn .g-icon{width:18px;height:18px;flex-shrink:0}
.auth-btn.signout{font-size:12px;padding:6px 12px;color:var(--text-2)}

/* Vacation bar */
.vacation-bar{border-radius:14px;padding:16px 18px;margin-bottom:14px;background:var(--vacation-gradient);position:relative;overflow:hidden;cursor:pointer;transition:transform 0.2s}
.vacation-bar:hover{transform:translateY(-1px)}
.vacation-bar::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(255,255,255,0.03) 20px,rgba(255,255,255,0.03) 40px)}
.vacation-header{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.vacation-title{font-size:14px;font-weight:600;color:rgba(255,255,255,0.95);display:flex;align-items:center;gap:8px}
.vacation-days{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:#fff}
.vacation-label{font-size:11px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:1px}
.vacation-progress{height:4px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:12px;position:relative;z-index:1;overflow:hidden}
.vacation-progress-fill{height:100%;border-radius:3px;background:rgba(255,255,255,0.7);transition:width 0.6s ease}
.vacation-empty{border:2px dashed var(--border-strong);border-radius:14px;padding:20px;text-align:center;cursor:pointer;margin-bottom:14px;transition:all 0.2s;color:var(--text-3);font-size:14px}
.vacation-empty:hover{border-color:var(--accent);color:var(--accent)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border-radius:12px;padding:12px;background:var(--bg-card);border-left:3px solid var(--text-muted);transition:all 0.3s;box-shadow:var(--shadow-card)}
.stat.active{border-left-color:var(--stat-color)}
.stat-val{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;color:var(--text-muted);transition:color 0.3s}
.stat.active .stat-val{color:var(--stat-color)}
.stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.stat.klart-glow{border-left-color:var(--green);box-shadow:var(--shadow-card),0 0 20px var(--klart-glow);animation:softPulse 3s ease infinite}
.stat.klart-glow .stat-val{color:var(--green)}
@keyframes softPulse{0%,100%{box-shadow:var(--shadow-card),0 0 16px var(--klart-glow)}50%{box-shadow:var(--shadow-card),0 0 28px var(--klart-glow)}}

/* Categories */
.categories{display:flex;flex-direction:column;gap:8px}
.cat-card{border-radius:14px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;transition:all 0.25s;box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.cat-card:hover{background:var(--bg-card-hover);transform:translateY(-1px)}
.cat-top{display:flex;justify-content:space-between;align-items:center}
.cat-left{display:flex;align-items:center;gap:10px}
.cat-icon{font-size:20px}
.cat-name{font-size:15px;font-weight:600}
.cat-right{display:flex;align-items:center;gap:10px}
.cat-count{font-size:12px;color:var(--text-3);font-family:'Space Mono',monospace}
.cat-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:0.5px}
.cat-arrow{color:var(--text-3);font-size:12px;transition:transform 0.25s}
.cat-progress{height:3px;background:var(--bg-input);border-radius:2px;margin-top:10px;overflow:hidden}
.cat-progress-fill{height:100%;border-radius:2px;transition:width 0.5s ease,background 0.3s}

/* Tasks */
.task-list{padding:8px 0 4px;display:flex;flex-direction:column;gap:6px}
.task{border-radius:10px;padding:12px;background:var(--bg-root);border:1px solid var(--border);transition:all 0.2s;animation:fadeSlideIn 0.25s ease forwards;opacity:0}
.task:hover{border-color:var(--border-strong)}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task-info{flex:1;min-width:0}
.task-name{font-size:14px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px;line-height:1.4}
.task-meta{font-size:11px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.task-meta .dot{color:var(--text-muted);font-size:8px}
.task-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.task-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.task-btn:hover{transform:scale(1.05);background:var(--bg-card-hover)}
.check-btn{width:42px;height:42px;border-radius:10px;border:2px solid var(--green);background:var(--green-soft);color:var(--text-1);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.check-btn:hover{transform:scale(1.08)}
.check-btn:active{transform:scale(0.95)}
.check-btn.pop{animation:checkPop 0.5s ease}
.task-progress{height:2px;background:var(--bg-input);border-radius:2px;margin-top:8px;overflow:hidden}
.task-progress-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
.date-pick{margin-top:6px;display:flex;align-items:center;gap:6px;animation:fadeSlideIn 0.2s ease forwards;opacity:0}
.date-pick input{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-1);font-family:'DM Sans',sans-serif;font-size:13px}
.date-pick button{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}

/* Sort / Modal / Form */
.sort-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;padding:8px 0}
.sort-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.sort-btn{padding:5px 10px;border-radius:6px;font-size:12px;border:none;background:transparent;color:var(--text-3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.sort-btn:hover{background:var(--bg-card)}
.sort-btn.active{background:var(--bg-card-hover);color:var(--text-1)}
.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.15s ease;backdrop-filter:blur(6px)}
@media(min-width:500px){.modal-overlay{align-items:center}}
.modal{background:var(--bg-modal);border-radius:20px 20px 0 0;padding:24px 20px env(safe-area-inset-bottom,20px);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;animation:slideUp 0.25s ease;border:1px solid var(--border);box-shadow:0 -8px 40px rgba(0,0,0,0.3)}
@media(min-width:500px){.modal{border-radius:20px;margin:20px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:600}
.modal-close{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg-card);color:var(--text-2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:500}
.form-input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-1);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.2s}
.form-input:focus{border-color:var(--accent)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cat-opt{padding:9px 8px;border-radius:9px;font-size:12px;text-align:center;border:1px solid var(--border);cursor:pointer;background:var(--bg-card);color:var(--text-2);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.cat-opt.sel{font-weight:600}
.freq-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.freq-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:'Space Mono',monospace;background:var(--bg-card);color:var(--text-2);transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.freq-btn.sel{border-color:var(--accent);background:rgba(99,102,241,0.12);color:var(--accent)}
.freq-hint{font-size:12px;color:var(--text-3);margin-top:6px;font-style:italic}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn-primary{flex:1;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
.btn-primary:hover{box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.btn-delete{padding:13px 16px;border-radius:12px;border:1px solid var(--red-soft);background:var(--red-soft);color:var(--red);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.btn-delete:hover{background:rgba(255,71,87,0.15)}
.btn-secondary{flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-1);font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes checkPop{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(0.92)}100%{transform:scale(1)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:380px){.stats{gap:6px}.stat{padding:10px 8px}.stat-val{font-size:20px}.add-btn span.plus-label{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey: "AIzaSyD-n66FkaZuWkLN8r2i-iMBv-FBXklwLbM",
  authDomain: "puls-whack-a-do.firebaseapp.com",
  projectId: "puls-whack-a-do",
  storageBucket: "puls-whack-a-do.firebasestorage.app",
  messagingSenderId: "348032853742",
  appId: "1:348032853742:web:2a9b573470f28c5dedf5ff",
  measurementId: "G-Q6W3PVF0ZY"
});

const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

// Offline persistence
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.log('Persistence:', e.code));

// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const CATEGORIES = [
  { id:'content', label:'Content', icon:'🎬', varName:'--cat-content' },
  { id:'fitness', label:'Fitness', icon:'💪', varName:'--cat-fitness' },
  { id:'hem', label:'Hem', icon:'🏠', varName:'--cat-hem' },
  { id:'personligt', label:'Personligt', icon:'✨', varName:'--cat-personligt' },
  { id:'business', label:'Business', icon:'💼', varName:'--cat-business' },
  { id:'recovery', label:'Återhämtning', icon:'🌿', varName:'--cat-recovery' },
  { id:'other', label:'Övrigt', icon:'📌', varName:'--cat-other' },
];

const VACATION_TASK = { id:'__vacation__', name:'Semester', category:'recovery', frequencyDays:90, lastDone:null, isProtected:true };

const DEFAULT_TASKS = [
  { id:'d1', name:'Publicera på TikTok', category:'content', frequencyDays:2, lastDone:null },
  { id:'d2', name:'Publicera på Instagram', category:'content', frequencyDays:3, lastDone:null },
  { id:'d3', name:'Ladda upp på YouTube', category:'content', frequencyDays:7, lastDone:null },
  { id:'d4', name:'Skicka mejl för samarbeten', category:'business', frequencyDays:3, lastDone:null },
  { id:'d5', name:'Gymma', category:'fitness', frequencyDays:2, lastDone:null },
  { id:'d6', name:'Städa hemma', category:'hem', frequencyDays:3, lastDone:null },
  { id:'d7', name:'Tvätta bilen', category:'hem', frequencyDays:14, lastDone:null },
  { id:'d8', name:'Gå på dejt', category:'personligt', frequencyDays:21, lastDone:null },
  { ...VACATION_TASK, frequencyDays:90 },
];

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let state = { tasks:[], theme:'dark', expandedCat:null, sort:'urgency', modal:null, datePicking:null, user:null, syncStatus:'offline' };
let _unsub = null; // Firestore realtime listener

// ═══════════════════════════════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════════════════════════════
function saveLocal() {
  try { localStorage.setItem('puls-data', JSON.stringify({ tasks:state.tasks, theme:state.theme })); } catch(e){}
}

function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('puls-data'));
    if (d?.tasks) { state.tasks = d.tasks; ensureVacation(); } else { state.tasks = DEFAULT_TASKS.map(t=>({...t})); }
    if (d?.theme) state.theme = d.theme;
  } catch(e) { state.tasks = DEFAULT_TASKS.map(t=>({...t})); }
}

function ensureVacation() {
  if (!state.tasks.find(t=>t.id==='__vacation__')) state.tasks.push({...VACATION_TASK});
  const vt = state.tasks.find(t=>t.id==='__vacation__');
  if (vt) vt.isProtected = true;
}

async function saveToCloud() {
  if (!state.user) return;
  state.syncStatus = 'syncing'; render();
  try {
    await db.collection('users').doc(state.user.uid).set({
      tasks: state.tasks, theme: state.theme,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    state.syncStatus = 'synced';
  } catch(e) { console.error('Cloud save:', e); state.syncStatus = 'offline'; }
  render();
}

function save() {
  saveLocal();
  clearTimeout(save._t);
  save._t = setTimeout(()=>saveToCloud(), 600);
}
save._t = null;

function startRealtimeSync() {
  if (_unsub) _unsub();
  if (!state.user) return;
  _unsub = db.collection('users').doc(state.user.uid).onSnapshot(snap => {
    if (snap.exists) {
      const d = snap.data();
      if (d.tasks) { state.tasks = d.tasks; ensureVacation(); saveLocal(); }
      if (d.theme) state.theme = d.theme;
      state.syncStatus = 'synced'; render();
    }
  }, err => { console.error('Sync:', err); state.syncStatus = 'offline'; render(); });
}

async function mergeLocalToCloud() {
  if (!state.user) return;
  const snap = await db.collection('users').doc(state.user.uid).get();
  if (snap.exists && snap.data().tasks?.length > 0) return; // Cloud has data
  await saveToCloud(); // Push local data up
}

// ═══════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════
async function signInWithGoogle() {
  try { await auth.signInWithPopup(googleProvider); }
  catch(e) {
    if (e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request') {
      await auth.signInWithRedirect(googleProvider);
    } else console.error('Auth:', e);
  }
}

async function signOutUser() {
  if (_unsub) { _unsub(); _unsub=null; }
  await auth.signOut();
  state.user = null; state.syncStatus = 'offline'; render();
}

auth.onAuthStateChanged(async user => {
  state.user = user;
  if (user) {
    state.syncStatus = 'syncing'; render();
    await mergeLocalToCloud();
    startRealtimeSync();
  } else {
    state.syncStatus = 'offline';
    if (_unsub) { _unsub(); _unsub=null; }
    render();
  }
});

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
function genId() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }
function daysSince(d) { if(!d)return null; return Math.floor((new Date()-new Date(d))/864e5); }
function urgency(t) { const ds=daysSince(t.lastDone); return ds===null?1:ds/t.frequencyDays; }
function urgencyColor(u) { const s=getComputedStyle(document.documentElement); if(u>=1)return s.getPropertyValue('--red').trim(); if(u>=0.75)return s.getPropertyValue('--orange').trim(); if(u>=0.5)return s.getPropertyValue('--yellow').trim(); return s.getPropertyValue('--green').trim(); }
function urgencyLabel(u) { if(u>=1)return'Förfallen'; if(u>=0.75)return'Snart'; if(u>=0.5)return'På gång'; return'Klart'; }
function urgencyBadgeBg(u) { if(u>=1)return'var(--red-soft)'; if(u>=0.75)return'var(--orange-soft)'; if(u>=0.5)return'var(--yellow-soft)'; return'var(--green-soft)'; }
function urgencyBadgeColor(u) { if(u>=1)return'var(--red)'; if(u>=0.75)return'var(--orange)'; if(u>=0.5)return'var(--yellow)'; return'var(--green)'; }
function timeAgo(d) { if(!d)return'Aldrig'; const ds=daysSince(d); if(ds===0)return'Idag'; if(ds===1)return'Igår'; return ds+' dagar sedan'; }
function catColor(id) { const c=CATEGORIES.find(x=>x.id===id); return c?`var(${c.varName})`:'var(--text-3)'; }
function catTasks(id) { return state.tasks.filter(t=>t.category===id&&t.id!=='__vacation__'); }
function catUrgency(id) { const t=catTasks(id); return t.length?Math.max(...t.map(urgency)):0; }
function catKlartRatio(id) { const t=catTasks(id); if(!t.length)return 1; return t.filter(x=>urgency(x)<0.75).length/t.length; }
function todayISO() { return new Date().toISOString().split('T')[0]; }
function formatFreq(d) { d=parseInt(d); if(d===1)return'dag'; if(d===7)return'vecka'; if(d===14)return'annan vecka'; if(d===30)return'månad'; return d+':e dag'; }

// Google SVG icon
const G_SVG = `<svg class="g-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('metaTheme').content = state.theme==='dark'?'#0A0A0F':'#FFF5F7';

  const all = state.tasks.filter(t=>t.id!=='__vacation__');
  const overdue = all.filter(t=>urgency(t)>=1).length;
  const soon = all.filter(t=>{ const u=urgency(t); return u>=0.75&&u<1; }).length;
  const klart = all.filter(t=>urgency(t)<0.5).length;
  const allKlart = overdue===0 && soon===0;

  app.innerHTML = renderHeader() + renderAuthBar() + renderVacation() + renderStats(overdue,soon,klart,allKlart)
    + (state.expandedCat ? renderTaskView() : renderCategories())
    + (state.modal ? renderModal() : '');
  bindEvents();
}

function renderHeader() {
  return `<header class="header"><div class="header-row"><div><h1 class="logo"><span class="logo-icon">⚡</span> PULS</h1><p class="subtitle">Håll koll på allt. Varje dag.</p></div><div class="header-actions"><button class="theme-toggle" data-action="toggleTheme">${state.theme==='dark'?'☀️':'🌙'}</button><button class="add-btn" data-action="addTask"><span>+</span> <span class="plus-label">Ny</span></button></div></div></header>`;
}

function renderAuthBar() {
  if (state.user) {
    const si = {synced:'☁️ Synkad',syncing:'🔄 Synkar...',offline:'📴 Offline'}[state.syncStatus];
    return `<div class="auth-bar"><div class="auth-left">${state.user.photoURL?`<img class="auth-avatar" src="${state.user.photoURL}" referrerpolicy="no-referrer">`:''}<div><div class="auth-name">${state.user.displayName||'Inloggad'}</div><div class="auth-email">${state.user.email||''}</div></div></div><div class="auth-right"><span class="sync-badge ${state.syncStatus}">${si}</span><button class="auth-btn signout" data-action="signOut">Logga ut</button></div></div>`;
  }
  return `<div class="auth-bar" style="justify-content:center"><button class="auth-btn google" data-action="signIn">${G_SVG} Logga in med Google</button></div>`;
}

function renderVacation() {
  const vt = state.tasks.find(t=>t.id==='__vacation__');
  if (!vt) return '';
  if (!vt.lastDone) return `<div class="vacation-empty" data-action="editVacation">🏖️ Ställ in din nästa semester – ditt ljus i tunneln</div>`;
  const ds = daysSince(vt.lastDone);
  const daysLeft = Math.max(0, vt.frequencyDays-ds);
  const progress = Math.min(ds/vt.frequencyDays, 1);
  const over = daysLeft===0;
  return `<div class="vacation-bar" data-action="editVacation"><div class="vacation-header"><div class="vacation-title">🏖️ Semester</div><div style="text-align:right"><div class="vacation-days">${over?'🎉 Dags!':daysLeft}</div><div class="vacation-label">${over?'Njut!':'dagar kvar'}</div></div></div><div class="vacation-progress"><div class="vacation-progress-fill" style="width:${progress*100}%"></div></div></div>`;
}

function renderStats(overdue, soon, klart, allKlart) {
  return `<div class="stats"><div class="stat ${overdue>0?'active':''}" style="--stat-color:var(--red)"><div class="stat-val">${overdue}</div><div class="stat-label">Förfallna</div></div><div class="stat ${soon>0?'active':''}" style="--stat-color:var(--orange)"><div class="stat-val">${soon}</div><div class="stat-label">Snart</div></div><div class="stat ${allKlart?'klart-glow':(klart>0?'active':'')}" style="--stat-color:var(--green)"><div class="stat-val">${klart}</div><div class="stat-label">Klart</div></div></div>`;
}

function renderCategories() {
  let h='<div class="categories">';
  for (const cat of CATEGORIES) {
    const tasks=catTasks(cat.id); if(!tasks.length)continue;
    const wu=catUrgency(cat.id), ratio=catKlartRatio(cat.id), cc=catColor(cat.id), uc=urgencyColor(wu);
    const kc=tasks.filter(t=>urgency(t)<0.75).length;
    const st=kc===tasks.length?'✓ Klart':`${kc}/${tasks.length}`;
    const sb=kc===tasks.length?'var(--green-soft)':urgencyBadgeBg(wu);
    const sc=kc===tasks.length?'var(--green)':urgencyBadgeColor(wu);
    h+=`<div class="cat-card" data-action="expandCat" data-cat="${cat.id}" style="--cat-color:${cc}"><div class="cat-top"><div class="cat-left"><span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.label}</span></div><div class="cat-right"><span class="cat-status" style="background:${sb};color:${sc}">${st}</span><span class="cat-count">${tasks.length}</span><span class="cat-arrow">▶</span></div></div><div class="cat-progress"><div class="cat-progress-fill" style="width:${ratio*100}%;background:${ratio===1?'var(--green)':uc}"></div></div></div>`;
  }
  return h+'</div>';
}

function renderTaskView() {
  const cat=CATEGORIES.find(c=>c.id===state.expandedCat); if(!cat)return'';
  const tasks=catTasks(cat.id);
  const sorted=[...tasks].sort((a,b)=>state.sort==='urgency'?urgency(b)-urgency(a):a.name.localeCompare(b.name,'sv'));
  let h=`<div style="margin-bottom:12px"><button class="cat-card" data-action="collapseCat" style="--cat-color:${catColor(cat.id)};border-color:${catColor(cat.id)}30;margin-bottom:4px"><div class="cat-top"><div class="cat-left"><span style="font-size:14px;color:var(--text-3);margin-right:4px">←</span><span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.label}</span></div><div class="cat-right"><span class="cat-count">${tasks.length} uppgifter</span></div></div></button><div class="sort-row"><span class="sort-label">Sortera:</span><button class="sort-btn ${state.sort==='urgency'?'active':''}" data-action="setSort" data-sort="urgency">Brådskande</button><button class="sort-btn ${state.sort==='name'?'active':''}" data-action="setSort" data-sort="name">Namn</button></div></div><div class="task-list">`;
  sorted.forEach((task,i)=>{
    const u=urgency(task), ds=daysSince(task.lastDone), dl=ds!==null?task.frequencyDays-ds:0, uc=urgencyColor(u), pct=Math.min(u*100,100);
    h+=`<div class="task" style="animation-delay:${i*0.04}s;border-left:3px solid ${uc}"><div class="task-top"><div class="task-info"><div class="task-name">${task.name} <span class="task-badge" style="background:${urgencyBadgeBg(u)};color:${urgencyBadgeColor(u)}">${urgencyLabel(u)}</span></div><div class="task-meta"><span>Var ${task.frequencyDays}:e dag</span><span class="dot">·</span><span style="color:${urgencyBadgeColor(u)}">${timeAgo(task.lastDone)}</span>${ds!==null?`<span class="dot">·</span><span style="color:${dl<=0?'var(--red)':dl<=1?'var(--orange)':'var(--text-2)'};font-weight:${dl<=0?600:400}">${dl<=0?Math.abs(dl)+'d över':dl+'d kvar'}</span>`:''}</div></div><div class="task-actions"><button class="task-btn" data-action="editTask" data-id="${task.id}">✏️</button><button class="task-btn" data-action="pickDate" data-id="${task.id}">📅</button><button class="check-btn" data-action="checkTask" data-id="${task.id}" style="border-color:${uc};background:${urgencyBadgeBg(u)}">✓</button></div></div>${state.datePicking===task.id?`<div class="date-pick" style="animation-delay:0s"><input type="date" id="datepick-${task.id}" value="${todayISO()}" max="${todayISO()}"><button style="background:var(--accent);color:#fff" data-action="confirmDate" data-id="${task.id}">Spara</button><button style="background:var(--bg-card);color:var(--text-2);border:1px solid var(--border)" data-action="cancelDate">Avbryt</button></div>`:''}<div class="task-progress"><div class="task-progress-fill" style="width:${pct}%;background:${uc}"></div></div></div>`;
  });
  return h+'</div>';
}

function renderModal() {
  const m=state.modal; if(!m)return'';
  if (m.type==='confirm') return `<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()"><h3 style="font-size:18px;margin-bottom:8px;font-weight:600">Ta bort uppgift?</h3><p style="color:var(--text-2);font-size:14px;margin-bottom:20px">Denna åtgärd kan inte ångras.</p><div class="btn-row"><button class="btn-secondary" data-action="closeModal">Avbryt</button><button class="btn-primary" style="background:var(--red)" data-action="confirmDelete" data-id="${m.taskId}">Ta bort</button></div></div></div>`;

  if (m.type==='vacation') {
    const vt=state.tasks.find(t=>t.id==='__vacation__');
    return `<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 class="modal-title">🏖️ Semester-nedräkning</h2><button class="modal-close" data-action="closeModal">✕</button></div><div class="form-group"><label class="form-label">Semester var X:e dag</label><input class="form-input" type="number" id="vac-freq" value="${vt?vt.frequencyDays:90}" min="1"><p class="freq-hint" style="margin-top:6px">T.ex. 90 = var 3:e månad</p></div><div class="form-group"><label class="form-label">Senaste semester (datum)</label><input class="form-input" type="date" id="vac-last" value="${vt?.lastDone?vt.lastDone.split('T')[0]:todayISO()}" max="${todayISO()}"></div><div class="btn-row"><button class="btn-primary" data-action="saveVacation">Spara</button></div></div></div>`;
  }

  const t=m.task||{}, isE=!!t.id;
  return `<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 class="modal-title">${isE?'Redigera uppgift':'Ny uppgift'}</h2><button class="modal-close" data-action="closeModal">✕</button></div><div class="form-group"><label class="form-label">Namn</label><input class="form-input" id="task-name" value="${t.name||''}" placeholder="T.ex. Publicera på TikTok" autofocus></div><div class="form-group"><label class="form-label">Kategori</label><div class="cat-grid">${CATEGORIES.map(c=>{const sel=(t.category||state.expandedCat||'content')===c.id;return`<button class="cat-opt ${sel?'sel':''}" data-action="setCat" data-cat="${c.id}" style="${sel?`border-color:${catColor(c.id)};color:${catColor(c.id)};font-weight:600`:''}">${c.icon} ${c.label}</button>`;}).join('')}</div></div><div class="form-group"><label class="form-label">Frekvens (dagar)</label><div class="freq-row">${[1,2,3,7,14,21,30].map(d=>`<button class="freq-btn ${parseInt(t.frequencyDays||7)===d?'sel':''}" data-action="setFreq" data-freq="${d}">${d}</button>`).join('')}<input class="form-input" style="width:65px;text-align:center" id="task-freq" type="number" min="1" value="${t.frequencyDays||7}"></div><p class="freq-hint">= var ${formatFreq(t.frequencyDays||7)}</p></div>${isE?`<div class="form-group"><label class="form-label">Senast gjord (datum)</label><input class="form-input" type="date" id="task-lastdone" value="${t.lastDone?t.lastDone.split('T')[0]:''}" max="${todayISO()}"></div>`:''}<div class="btn-row">${isE&&!t.isProtected?`<button class="btn-delete" data-action="deleteTask" data-id="${t.id}">🗑 Ta bort</button>`:''}<button class="btn-primary" data-action="saveTask">${isE?'Spara':'Lägg till'}</button></div></div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════════
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',handleAction));
  const fi = document.getElementById('task-freq');
  if (fi) fi.addEventListener('input', ()=>{
    const h=fi.closest('.form-group')?.querySelector('.freq-hint');
    if(h) h.textContent='= var '+formatFreq(fi.value||'7');
    document.querySelectorAll('.freq-btn').forEach(b=>b.classList.toggle('sel',b.dataset.freq===fi.value));
  });
  const af=document.querySelector('[autofocus]'); if(af)setTimeout(()=>af.focus(),50);
}

function handleAction(e) {
  const el=e.currentTarget, a=el.dataset.action;
  switch(a) {
    case 'toggleTheme': state.theme=state.theme==='dark'?'light':'dark'; save();render();break;
    case 'signIn': signInWithGoogle();break;
    case 'signOut': signOutUser();break;
    case 'addTask': state.modal={type:'task'}; pushNav();render();break;
    case 'expandCat': state.expandedCat=el.dataset.cat; state.datePicking=null; pushNav();render();break;
    case 'collapseCat': state.expandedCat=null; state.datePicking=null; render();break;
    case 'setSort': state.sort=el.dataset.sort; render();break;
    case 'checkTask': { const t=state.tasks.find(x=>x.id===el.dataset.id); if(t){t.lastDone=new Date().toISOString();el.classList.add('pop');save();setTimeout(()=>render(),450);} break; }
    case 'pickDate': state.datePicking=state.datePicking===el.dataset.id?null:el.dataset.id; render();break;
    case 'confirmDate': { const inp=document.getElementById('datepick-'+el.dataset.id); if(inp?.value){const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){t.lastDone=new Date(inp.value+'T12:00:00').toISOString();state.datePicking=null;save();render();}} break; }
    case 'cancelDate': state.datePicking=null; render();break;
    case 'editTask': { const t=state.tasks.find(x=>x.id===el.dataset.id); if(t){state.modal={type:'task',task:{...t}};pushNav();render();} break; }
    case 'closeModal': state.modal=null; render();break;
    case 'editVacation': state.modal={type:'vacation'}; pushNav();render();break;
    case 'saveVacation': { const f=parseInt(document.getElementById('vac-freq').value)||90, ld=document.getElementById('vac-last').value; let vt=state.tasks.find(t=>t.id==='__vacation__'); if(!vt){vt={...VACATION_TASK};state.tasks.push(vt);} vt.frequencyDays=f; vt.lastDone=ld?new Date(ld+'T12:00:00').toISOString():new Date().toISOString(); state.modal=null; save();render();break; }
    case 'setCat': { document.querySelectorAll('.cat-opt').forEach(b=>{b.classList.remove('sel');b.removeAttribute('style');}); el.classList.add('sel'); const cc=catColor(el.dataset.cat); el.style.cssText=`border-color:${cc};color:${cc};font-weight:600`; document.querySelector('.cat-grid').dataset.selected=el.dataset.cat; break; }
    case 'setFreq': { const f=el.dataset.freq; document.getElementById('task-freq').value=f; document.querySelectorAll('.freq-btn').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); const h=el.closest('.form-group').querySelector('.freq-hint'); if(h)h.textContent='= var '+formatFreq(f); break; }
    case 'saveTask': {
      const ne=document.getElementById('task-name'), fe=document.getElementById('task-freq');
      const sc=document.querySelector('.cat-grid')?.dataset.selected||document.querySelector('.cat-opt.sel')?.dataset.cat||state.expandedCat||'content';
      const n=ne?.value?.trim(); if(!n){ne?.focus();return;} const f=Math.max(1,parseInt(fe?.value)||7);
      if(state.modal.task?.id){const t=state.tasks.find(x=>x.id===state.modal.task.id);if(t){t.name=n;t.category=sc;t.frequencyDays=f;const lde=document.getElementById('task-lastdone');if(lde?.value)t.lastDone=new Date(lde.value+'T12:00:00').toISOString();else if(lde&&!lde.value)t.lastDone=null;}}
      else state.tasks.push({id:genId(),name:n,category:sc,frequencyDays:f,lastDone:null});
      state.modal=null; save();render();break;
    }
    case 'deleteTask': state.modal={type:'confirm',taskId:el.dataset.id}; render();break;
    case 'confirmDelete': state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id); state.modal=null; save();render();break;
  }
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function pushNav() { history.pushState({},''); }
window.addEventListener('popstate', ()=>{ if(state.modal){state.modal=null;render();}else if(state.expandedCat){state.expandedCat=null;state.datePicking=null;render();} });

// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', ()=>{
  loadLocal();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
  setInterval(()=>render(), 60000);
});
