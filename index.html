<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Puls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0A0A0F;--bg2:rgba(255,255,255,0.03);--bg3:rgba(255,255,255,0.055);
  --bg-in:rgba(255,255,255,0.04);--bg-modal:#14141F;
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.1);
  --t1:#E8E8ED;--t2:#888;--t3:#555;--tm:#333;
  --acc:#6366F1;--acc-g:rgba(99,102,241,0.35);
  --grn:#51CF66;--grn-s:rgba(81,207,102,0.12);
  --org:#FF8C42;--org-s:rgba(255,140,66,0.1);
  --red:#FF4757;--red-s:rgba(255,71,87,0.08);
  --yel:#FFD43B;--yel-s:rgba(255,212,59,0.1);
  --ov:rgba(0,0,0,0.7);
  --c-cnt:#FF6B6B;--c-fit:#51CF66;--c-hem:#339AF0;--c-per:#DA77F2;
  --c-biz:#FFD43B;--c-rec:#74C0FC;--c-oth:#868E96;
}
[data-theme="light"]{
  --bg:#FFF5F7;--bg2:rgba(255,255,255,0.85);--bg3:rgba(255,255,255,1);
  --bg-in:rgba(0,0,0,0.03);--bg-modal:#FFF;
  --brd:rgba(0,0,0,0.06);--brd2:rgba(0,0,0,0.1);
  --t1:#3D2C35;--t2:#8E7A85;--t3:#B8A5B0;--tm:#D4C5CC;
  --acc:#C084A0;--acc-g:rgba(192,132,160,0.3);
  --grn:#7BC5A0;--grn-s:rgba(123,197,160,0.15);
  --org:#E8A87C;--org-s:rgba(232,168,124,0.15);
  --red:#D4798C;--red-s:rgba(212,121,140,0.1);
  --yel:#E8C87C;--yel-s:rgba(232,200,124,0.15);
  --ov:rgba(255,245,247,0.85);
  --c-cnt:#D4798C;--c-fit:#7BC5A0;--c-hem:#7BAED4;--c-per:#B88DC4;
  --c-biz:#D4C07B;--c-rec:#7BB8D4;--c-oth:#A8A0AC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-y:scroll}
body{min-height:100%;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
.app{max-width:520px;margin:0 auto;padding:0 16px 100px;position:relative}

/* Header */
.hdr{padding:env(safe-area-inset-top,8px) 0 0;position:sticky;top:0;z-index:20;background:var(--bg);transition:background .4s}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px}
.logo{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--t1)}
.logo-z{font-size:18px}
.hdr-actions{display:flex;align-items:center;gap:6px}
.profile-chip{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:20px;background:var(--bg2);border:1px solid var(--brd);cursor:pointer;transition:all .2s;position:relative}
.profile-chip:hover{background:var(--bg3)}
.profile-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-dot.synced{background:var(--grn)}.sync-dot.syncing{background:var(--yel);animation:blink 1.2s ease infinite}.sync-dot.offline{background:var(--t3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.profile-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-modal);border:1px solid var(--brd2);border-radius:12px;padding:12px;min-width:220px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:30;animation:fadeIn .15s ease}
.profile-drop .p-name{font-size:13px;font-weight:600;margin-bottom:2px}
.profile-drop .p-email{font-size:11px;color:var(--t3);margin-bottom:6px}
.profile-drop .p-sync{font-size:11px;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.p-divider{height:1px;background:var(--brd);margin:8px 0}
.p-btn{width:100%;padding:8px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:6px;text-align:left;display:flex;align-items:center;gap:6px}
.p-btn:hover{background:var(--bg3);color:var(--t1)}
.p-btn.danger:hover{background:var(--red-s);color:var(--red)}
.p-hh-badge{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--acc-g);color:var(--acc);font-weight:600;margin-left:auto}
.signin-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--brd2);background:var(--bg2);color:var(--t1);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.signin-btn:hover{background:var(--bg3)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--brd);background:var(--bg2);color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--bg3)}
.add-btn{height:38px;padding:0 14px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
.add-btn:hover{box-shadow:0 4px 16px var(--acc-g)}
.add-btn span{font-size:18px;line-height:1}

/* Vacation */
.vac-strip{display:flex;align-items:center;gap:8px;padding:6px 0 8px;cursor:pointer;border-bottom:1px solid var(--brd)}
.vac-strip .vac-prog{flex:1;height:3px;background:var(--bg-in);border-radius:2px;overflow:hidden}
.vac-strip .vac-prog-fill{height:100%;border-radius:2px;background:var(--acc);transition:width .6s ease}
.vac-strip .vac-txt{font-size:12px;font-family:'Space Mono',monospace;font-weight:600;color:var(--acc)}
.vac-empty{display:flex;align-items:center;gap:6px;padding:6px 0 8px;cursor:pointer;font-size:12px;color:var(--t3);border-bottom:1px solid var(--brd)}
.vac-empty:hover{color:var(--acc)}

/* Stats */
.stats-inline{display:flex;align-items:center;gap:12px;padding:4px 0 10px;font-size:12px;color:var(--t3)}
.si{display:flex;align-items:center;gap:4px}
.si-num{font-family:'Space Mono',monospace;font-weight:700;font-size:13px}
.si-num.red{color:var(--red)}.si-num.org{color:var(--org)}.si-num.grn{color:var(--grn)}
.si-dot{width:6px;height:6px;border-radius:50%}
.all-clear{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grn);font-weight:500}

/* ═════════════════════════════════════════════ */
/* TASK CARD                                     */
/* ═════════════════════════════════════════════ */
.tc{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--bg2);border:2px solid var(--brd);margin-bottom:6px;transition:all .25s;animation:fadeSlideIn .25s ease forwards;opacity:0;cursor:pointer}
.tc:hover{background:var(--bg3)}
/* Color shift by urgency */
.tc.u-grn{border-color:rgba(81,207,102,.2)}
.tc.u-yel{border-color:rgba(255,212,59,.35);background:var(--yel-s)}
.tc.u-org{border-color:rgba(255,140,66,.4);background:var(--org-s)}
.tc.u-red{border-color:rgba(255,71,87,.45);background:var(--red-s)}
/* Shared */
.tc.shared{box-shadow:inset 3px 0 0 var(--acc)}
.shared-tag{font-size:9px;font-weight:600;padding:2px 5px;border-radius:4px;background:var(--acc-g);color:var(--acc)}

/* Days since – THE number */
.tc-days{text-align:center;min-width:48px;flex-shrink:0}
.tc-days-num{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;line-height:1}
.tc-days-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
/* In-category cards: slightly smaller number */
.tc.cat-card .tc-days-num{font-size:18px}
.tc.cat-card{padding:12px 14px}

/* Signal lamp */
.tc-lamp{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all .3s}
.tc-lamp.grn{background:var(--grn);box-shadow:0 0 6px rgba(81,207,102,.4)}
.tc-lamp.yel{background:transparent}
.tc-lamp.org{background:transparent}
.tc-lamp.red{background:var(--red);box-shadow:0 0 14px rgba(255,71,87,.6);animation:blink .8s ease infinite}

.tc-info{flex:1;min-width:0}
.tc-name{font-size:15px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-meta{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px}
.tc-meta .dot{color:var(--tm);font-size:8px}
.prio-pin{font-size:10px;color:var(--acc)}

/* Buttons */
.tc-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.tc-btn{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-family:'DM Sans',sans-serif}
.tc-btn:hover{background:var(--bg3);color:var(--t1)}
.tc-btn:active{transform:scale(.93)}
.tc-btn.check{width:42px;height:42px;border:2px solid var(--grn);background:var(--grn-s);color:var(--t1);font-size:18px;font-weight:700;border-radius:10px;padding:0}
.tc-btn.check.pop{animation:checkPop .5s ease}

/* Expand row */
.tc-expand{display:flex;align-items:center;gap:6px;padding:8px 16px 4px;animation:fadeSlideIn .15s ease forwards;opacity:0}
.tc-expand-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px;transition:all .15s}
.tc-expand-btn:hover{background:var(--bg3);color:var(--t1)}
.tc-expand-btn.del:hover{background:var(--red-s);color:var(--red)}
.date-pick{display:flex;align-items:center;gap:6px;padding:4px 16px 8px;animation:fadeSlideIn .2s ease forwards;opacity:0}
.date-pick input{padding:6px 10px;border-radius:8px;border:1px solid var(--brd2);background:var(--bg-in);color:var(--t1);font-family:'DM Sans',sans-serif;font-size:13px}
.date-pick button{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}

/* Divider + cat toggle */
.divider{display:flex;align-items:center;gap:10px;padding:16px 0 10px;cursor:pointer}
.divider:hover .divider-text{color:var(--t2)}
.divider-line{flex:1;height:1px;background:var(--brd)}
.divider-text{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--tm);font-weight:600;transition:color .15s;white-space:nowrap}

/* Category chips */
.cat-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;animation:fadeSlideIn .2s ease}
.cat-chip{padding:8px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--brd);cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s}
.cat-chip:hover{background:var(--bg3);border-color:var(--brd2)}
.cat-chip .cc-cnt{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--bg-in)}
.cat-chip .cc-urg{color:var(--red)}

/* Category expanded */
.freq-tabs{display:flex;gap:4px;margin-bottom:10px}
.freq-tab{flex:1;padding:7px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .2s}
.freq-tab.on{background:var(--bg3);color:var(--t1);border-color:var(--brd2);font-weight:600}
.weekday-grid{display:flex;gap:4px}
.wd-btn{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t3);font-size:12px;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all .15s}
.wd-btn:hover{background:var(--bg3)}.wd-btn.sel{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.md-grid{display:flex;flex-wrap:wrap;gap:4px}
.md-btn{width:38px;height:34px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--t3);font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;transition:all .15s;display:flex;align-items:center;justify-content:center}
.md-btn:hover{background:var(--bg3)}.md-btn.sel{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.cat-back{display:flex;align-items:center;gap:6px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--t2);margin-bottom:4px}
.cat-back:hover{color:var(--t1)}

/* ═════════ MODALS ═════════ */
.mo{position:fixed;inset:0;background:var(--ov);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;backdrop-filter:blur(6px)}
@media(min-width:500px){.mo{align-items:center}}
.md{background:var(--bg-modal);border-radius:20px 20px 0 0;padding:24px 20px env(safe-area-inset-bottom,20px);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease;border:1px solid var(--brd);box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@media(min-width:500px){.md{border-radius:20px;margin:20px}}
.md-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.md-title{font-size:18px;font-weight:600}
.md-close{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg2);color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fg{margin-bottom:18px}.fl{display:block;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:500}
.fi{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--brd2);background:var(--bg-in);color:var(--t1);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s}
.fi:focus{border-color:var(--acc)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.co{padding:9px 8px;border-radius:9px;font-size:12px;text-align:center;border:1px solid var(--brd);cursor:pointer;background:var(--bg2);color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .15s}.co.sel{font-weight:600}
.fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fb{width:42px;height:42px;border-radius:10px;border:1px solid var(--brd);font-size:13px;font-weight:600;cursor:pointer;font-family:'Space Mono',monospace;background:var(--bg2);color:var(--t2);transition:all .15s;display:flex;align-items:center;justify-content:center}
.fb.sel{border-color:var(--acc);background:rgba(99,102,241,.12);color:var(--acc)}
.fh{font-size:12px;color:var(--t3);margin-top:6px;font-style:italic}
.br{display:flex;gap:10px;margin-top:8px}
.bp{flex:1;padding:13px;border-radius:12px;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.bp:hover{box-shadow:0 4px 16px var(--acc-g)}
.bd{padding:13px 16px;border-radius:12px;border:1px solid var(--red-s);background:var(--red-s);color:var(--red);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.bs{flex:1;padding:13px;border-radius:12px;border:1px solid var(--brd);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.add-cat-row{display:flex;gap:6px;margin-top:8px}
.add-cat-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--brd2);background:var(--bg-in);color:var(--t1);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.add-cat-row button{padding:8px 14px;border-radius:8px;border:none;background:var(--acc);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}

/* Household */
.hh-code{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--acc);padding:16px;background:var(--acc-g);border-radius:12px;margin-bottom:16px;user-select:all}
.hh-members{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.hh-member{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg-in)}
.hh-member img{width:30px;height:30px;border-radius:50%}
.hh-member-name{font-size:13px;font-weight:500;flex:1}
.hh-member-you{font-size:10px;color:var(--acc);font-weight:600;text-transform:uppercase}
.hh-cat-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;background:var(--bg-in);margin-bottom:6px}
.hh-cat-toggle .hh-cat-l{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--tm);position:relative;cursor:pointer;transition:background .2s;border:none;padding:0;flex-shrink:0}
.toggle.on{background:var(--acc)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:20px}
.assign-row{display:flex;gap:8px;flex-wrap:wrap}
.assign-opt{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--brd);background:var(--bg2);cursor:pointer;font-size:12px;color:var(--t2);transition:all .15s}
.assign-opt:hover{background:var(--bg3)}.assign-opt.sel{border-color:var(--acc);color:var(--acc);font-weight:600}
.assign-opt img{width:20px;height:20px;border-radius:50%}
/* Auth */
.auth-provider-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:10px;border:1px solid var(--brd2);background:var(--bg-in);color:var(--t1);font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.auth-provider-btn:hover{background:var(--bg3);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* Onboarding */
.ob{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;animation:fadeIn .4s ease}
.ob-step{max-width:360px;animation:fadeSlideIn .4s ease forwards;opacity:0}
.ob-icon{font-size:56px;margin-bottom:20px}
.ob-title{font-size:22px;font-weight:700;margin-bottom:10px;line-height:1.3}
.ob-desc{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:28px}
.ob-demo{border-radius:12px;background:var(--bg3);border:1px solid var(--brd);padding:16px;margin-bottom:28px;text-align:left}
.ob-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--tm);transition:all .3s}
.ob-dot.on{background:var(--acc);width:24px;border-radius:4px}
.ob-next{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.ob-next:hover{box-shadow:0 4px 20px var(--acc-g)}
.ob-skip{margin-top:12px;font-size:12px;color:var(--tm);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif}
.ob-skip:hover{color:var(--t3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes checkPop{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.92)}100%{transform:scale(1)}}
/* Tab switcher */
.tabs{display:flex;gap:4px;padding:6px 0 10px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--brd);background:var(--bg2);color:var(--t3);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{background:var(--bg3);color:var(--t2)}
.tab.on{background:var(--bg3);color:var(--t1);border-color:var(--brd2);font-weight:600}
.tab .tab-count{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--bg-in)}
.tab .tab-count.hot{color:var(--red);background:var(--red-s)}
/* One-off todo card */
.todo-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--brd);margin-bottom:5px;animation:fadeSlideIn .2s ease forwards;opacity:0;cursor:pointer;transition:all .2s}
.todo-card:hover{background:var(--bg3)}
.todo-card.done{opacity:.4}
.todo-card.done .todo-name{text-decoration:line-through;color:var(--t3)}
.todo-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--brd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-size:14px;color:transparent}
.todo-check:hover{border-color:var(--grn);background:var(--grn-s)}
.todo-check.checked{border-color:var(--grn);background:var(--grn-s);color:var(--grn)}
.todo-info{flex:1;min-width:0}
.todo-name{font-size:14px;font-weight:500}
.todo-note{font-size:11px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-due{font-size:11px;color:var(--t3);margin-top:2px;display:flex;align-items:center;gap:4px}
.todo-due.overdue{color:var(--red)}
.todo-del{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--t3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.todo-del:hover{background:var(--red-s);color:var(--red)}
/* Todo empty state */
.todo-empty{text-align:center;padding:40px 20px;color:var(--t3)}
.todo-empty-icon{font-size:40px;margin-bottom:10px}
.todo-empty-text{font-size:14px;margin-bottom:4px}
.todo-empty-sub{font-size:12px;color:var(--tm)}
/* Show done toggle */
.todo-done-toggle{font-size:12px;color:var(--t3);cursor:pointer;padding:8px 0;transition:color .15s;text-align:center}
.todo-done-toggle:hover{color:var(--t2)}
/* Drag handle */
.todo-grip{display:flex;align-items:center;justify-content:center;width:20px;flex-shrink:0;color:var(--tm);font-size:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;letter-spacing:-1px}
.todo-grip:active{cursor:grabbing}
/* Dragging states */
.todo-card.dragging{opacity:.3;pointer-events:none}
.todo-card.drag-over-above{box-shadow:0 -2px 0 var(--acc)}
.todo-card.drag-over-below{box-shadow:0 2px 0 var(--acc)}
.drag-ghost{position:fixed;z-index:500;pointer-events:none;opacity:.85;transform:rotate(1.5deg);box-shadow:0 8px 30px rgba(0,0,0,.4);border-radius:10px;transition:none}
/* Todo groups */
.todo-group{margin-bottom:14px}
.todo-group-hdr{display:flex;align-items:center;gap:8px;padding:6px 0;margin-bottom:4px;cursor:pointer}
.todo-group-hdr:hover .todo-group-name{color:var(--t1)}
.todo-group-name{font-size:13px;font-weight:600;color:var(--t2);transition:color .15s}
.todo-group-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--t3);padding:1px 5px;border-radius:4px;background:var(--bg-in)}
.todo-group-prog{flex:1;height:2px;background:var(--brd);border-radius:1px;overflow:hidden;margin-left:4px}
.todo-group-prog-fill{height:100%;background:var(--grn);border-radius:1px;transition:width .4s ease}
.todo-quick-add{padding:2px 0 4px}
.todo-quick-input{width:100%;padding:8px 12px;border-radius:8px;border:1px dashed var(--brd);background:transparent;color:var(--t2);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:all .2s}
.todo-quick-input:focus{border-style:solid;border-color:var(--acc);background:var(--bg2)}
.todo-quick-input::placeholder{color:var(--tm)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ═══════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════
firebase.initializeApp({apiKey:"AIzaSyD-n66FkaZuWkLN8r2i-iMBv-FBXklwLbM",authDomain:"puls-whack-a-do.firebaseapp.com",projectId:"puls-whack-a-do",storageBucket:"puls-whack-a-do.firebasestorage.app",messagingSenderId:"348032853742",appId:"1:348032853742:web:2a9b573470f28c5dedf5ff",measurementId:"G-Q6W3PVF0ZY"});
const auth=firebase.auth(),db=firebase.firestore();
const gProv=new firebase.auth.GoogleAuthProvider();
db.enablePersistence({synchronizeTabs:true}).catch(e=>console.log('P:',e.code));

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const DEFAULT_CATS=[
  {id:'content',label:'Content',icon:'🎬',v:'--c-cnt'},
  {id:'fitness',label:'Fitness',icon:'💪',v:'--c-fit'},
  {id:'hem',label:'Hem',icon:'🏠',v:'--c-hem'},
  {id:'personligt',label:'Personligt',icon:'✨',v:'--c-per'},
  {id:'business',label:'Business',icon:'💼',v:'--c-biz'},
  {id:'recovery',label:'Återhämtning',icon:'🌿',v:'--c-rec'},
  {id:'other',label:'Övrigt',icon:'📌',v:'--c-oth'},
];
const EMOJI_POOL=['🎯','🧹','👶','🎨','📚','🏃','🎵','🐾','🌱','💊','🛒','🍳','📱','🚗','❤️','🎓'];
const VTASK={id:'__vacation__',name:'Semester',category:'recovery',frequencyDays:90,lastDone:null,isProtected:true};
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()}
const DEFAULTS=[
  {id:'d1',name:'Gymma',category:'fitness',frequencyDays:2,lastDone:daysAgo(5)},
  {id:'d2',name:'Städa hemma',category:'hem',frequencyDays:7,lastDone:daysAgo(6)},
  {id:'d3',name:'Handla mat',category:'hem',frequencyDays:5,lastDone:daysAgo(2)},
  {...VTASK,frequencyDays:90},
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S={
  tasks:[],customCats:[],theme:'light',expandedCat:null,
  modal:null,datePicking:null,expandedTask:null,showCats:false,
  tab:'pulser',todos:[],todoGroups:[],collapsedGroups:{},showDone:false,
  user:null,syncStatus:'offline',profileOpen:false,
  hiddenToday:{},liftedToPrio:new Set(),
  household:null,householdId:null,
  onboarding:0, // 0=not shown, 1/2/3=step, -1=done
};
let _unsub=null,_hhUnsub=null;
function getCats(){return[...DEFAULT_CATS,...S.customCats]}

// ═══════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════
function saveLocal(){try{localStorage.setItem('puls',JSON.stringify({tasks:S.tasks,todos:S.todos,todoGroups:S.todoGroups,theme:S.theme,householdId:S.householdId,customCats:S.customCats,hiddenToday:S.hiddenToday,onboarded:S.onboarding===-1}))}catch(e){}}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem('puls'));
    if(d?.tasks){S.tasks=d.tasks;ensV();S.onboarding=-1}else{S.tasks=DEFAULTS.map(t=>({...t}));S.onboarding=1}
    if(d?.todos)S.todos=d.todos;
    if(d?.todoGroups)S.todoGroups=d.todoGroups;
    if(d?.theme)S.theme=d.theme;if(d?.householdId)S.householdId=d.householdId;
    if(d?.customCats)S.customCats=d.customCats;
    if(d?.hiddenToday){const td=today();S.hiddenToday={};for(const[id,date]of Object.entries(d.hiddenToday)){if(date===td)S.hiddenToday[id]=date}}
  }catch(e){S.tasks=DEFAULTS.map(t=>({...t}));S.onboarding=1}
}
function ensV(){if(!S.tasks.find(t=>t.id==='__vacation__'))S.tasks.push({...VTASK});const v=S.tasks.find(t=>t.id==='__vacation__');if(v)v.isProtected=true}

async function saveCloud(){if(!S.user||S.user.isAnonymous)return;S.syncStatus='syncing';try{await db.collection('users').doc(S.user.uid).set({tasks:S.tasks,todos:S.todos,todoGroups:S.todoGroups,theme:S.theme,householdId:S.householdId||null,customCats:S.customCats,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});S.syncStatus='synced'}catch(e){S.syncStatus='offline'}}
async function saveHH(){if(!S.household||!S.householdId)return;try{await db.collection('households').doc(S.householdId).set({members:S.household.members,sharedCats:S.household.sharedCats||[],tasks:S.household.tasks||[],updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){console.error('HH:',e)}}
function save(){saveLocal();clearTimeout(save._t);save._t=setTimeout(()=>{saveCloud();if(S.household)saveHH()},600)}
save._t=null;

function startSync(){if(_unsub)_unsub();if(!S.user||S.user.isAnonymous)return;
  _unsub=db.collection('users').doc(S.user.uid).onSnapshot(s=>{if(s.exists){const d=s.data();if(d.tasks){S.tasks=d.tasks;ensV();saveLocal()}if(d.todos)S.todos=d.todos;if(d.todoGroups)S.todoGroups=d.todoGroups;if(d.theme)S.theme=d.theme;if(d.customCats)S.customCats=d.customCats;if(d.householdId&&d.householdId!==S.householdId){S.householdId=d.householdId;startHHSync()}S.syncStatus='synced';_qR()}},e=>{S.syncStatus='offline';_qR()})}
function startHHSync(){if(_hhUnsub)_hhUnsub();if(!S.householdId)return;
  _hhUnsub=db.collection('households').doc(S.householdId).onSnapshot(s=>{if(s.exists){S.household={code:S.householdId,...s.data()};_qR()}else{S.household=null;S.householdId=null;saveLocal();_qR()}},e=>console.error('HH:',e))}
// Queued render – debounce snapshot re-renders, skip if modal open
let _qT=null;function _qR(){clearTimeout(_qT);_qT=setTimeout(()=>{if(!S.modal)R()},300)}
async function mergeUp(){if(!S.user||S.user.isAnonymous)return;const s=await db.collection('users').doc(S.user.uid).get();if(s.exists&&s.data().tasks?.length>0){if(s.data().householdId)S.householdId=s.data().householdId;return}await saveCloud()}

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
async function authWithProvider(prov){try{await auth.signInWithPopup(prov)}catch(e){if(e.code==='auth/popup-blocked')await auth.signInWithRedirect(prov);else{S.modal={type:'authError',msg:e.message};R()}}}
async function anonSignIn(){try{await auth.signInAnonymously()}catch(e){S.modal={type:'authError',msg:e.message};R()}}
async function doSignOut(){if(_unsub){_unsub();_unsub=null}if(_hhUnsub){_hhUnsub();_hhUnsub=null}await auth.signOut();S.user=null;S.syncStatus='offline';S.profileOpen=false;S.household=null;R()}
auth.onAuthStateChanged(async u=>{S.user=u;if(u){if(u.isAnonymous){S.syncStatus='offline';R();return}S.syncStatus='syncing';R();await mergeUp();startSync();if(S.householdId)startHHSync()}else{S.syncStatus='offline';if(_unsub){_unsub();_unsub=null}if(_hhUnsub){_hhUnsub();_hhUnsub=null}R()}});

// ═══════════════════════════════════════════
// HOUSEHOLD
// ═══════════════════════════════════════════
function genHHCode(){const c='ABCDEFGHJKLMNPRSTUVWXYZ23456789';let r='';for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
async function createHH(){if(!S.user)return;const code=genHHCode();const me={uid:S.user.uid,name:S.user.displayName||'Du',photo:S.user.photoURL||''};await db.collection('households').doc(code).set({members:[me],sharedCats:[],tasks:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});S.householdId=code;await saveCloud();startHHSync()}
async function joinHH(code){if(!S.user)return false;code=code.toUpperCase().trim();const snap=await db.collection('households').doc(code).get();if(!snap.exists)return false;const d=snap.data();if(d.members.length>=2||d.members.find(m=>m.uid===S.user.uid))return false;d.members.push({uid:S.user.uid,name:S.user.displayName||'Du',photo:S.user.photoURL||''});await db.collection('households').doc(code).update({members:d.members});S.householdId=code;await saveCloud();startHHSync();return true}
async function leaveHH(){if(!S.householdId||!S.user||!S.household)return;const r=S.household.members.filter(m=>m.uid!==S.user.uid);if(r.length===0)await db.collection('households').doc(S.householdId).delete();else await db.collection('households').doc(S.householdId).update({members:r});if(_hhUnsub){_hhUnsub();_hhUnsub=null}S.householdId=null;S.household=null;await saveCloud();R()}
function toggleSharedCat(cid){
  if(!S.household)return;const sc=S.household.sharedCats||[];const i=sc.indexOf(cid);
  if(i>=0){const mv=(S.household.tasks||[]).filter(t=>t.category===cid);S.household.tasks=(S.household.tasks||[]).filter(t=>t.category!==cid);mv.forEach(t=>S.tasks.push(t));sc.splice(i,1)}
  else{const mv=S.tasks.filter(t=>t.category===cid&&t.id!=='__vacation__');S.tasks=S.tasks.filter(t=>t.category!==cid||t.id==='__vacation__');mv.forEach(t=>{t.assignedTo=t.assignedTo||null;S.household.tasks.push(t)});sc.push(cid)}
  S.household.sharedCats=sc;saveHH();saveLocal();saveCloud();R();
}
function isShared(cid){return S.household?.sharedCats?.includes(cid)||false}
function getPartner(){return S.household?.members?.find(m=>m.uid!==S.user?.uid)||null}

// ═══════════════════════════════════════════
// TASK HELPERS
// ═══════════════════════════════════════════
function allTasks(){return[...S.tasks.filter(t=>t.id!=='__vacation__'),...(S.household?.tasks||[])]}
function ctasks(cid){if(isShared(cid))return(S.household?.tasks||[]).filter(t=>t.category===cid);return S.tasks.filter(t=>t.category===cid&&t.id!=='__vacation__')}
function findTask(id){let t=S.tasks.find(x=>x.id===id);if(t)return{task:t,src:'p'};t=(S.household?.tasks||[]).find(x=>x.id===id);if(t)return{task:t,src:'h'};return null}

// ═══════════════════════════════════════════
// UTILS — ONE number: days since last done
// Color = urgency signal based on ratio
// ═══════════════════════════════════════════
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,5);
const dsince=d=>{if(!d)return null;return Math.floor((new Date()-new Date(d))/864e5)};
// Effective frequency in days for urgency ratio
function effFreq(t){
  if(t.freqType==='weekly')return 7;
  if(t.freqType==='monthly'){
    const now=new Date();const y=now.getFullYear(),m=now.getMonth();
    return new Date(y,m+1,0).getDate(); // days in current month
  }
  return t.frequencyDays||7;
}
const urg=t=>{const ds=dsince(t.lastDone);return ds===null?1:ds/effFreq(t)};
const urgCls=t=>{const u=urg(t);return u>=1?'u-red':u>=.75?'u-org':u>=.5?'u-yel':'u-grn'};
const lampCls=t=>{const u=urg(t);return u>=1?'red':u>=.75?'org':u>=.5?'yel':'grn'};
const dayCol=t=>{const u=urg(t);return u>=1?'var(--red)':u>=.75?'var(--org)':u>=.5?'var(--yel)':'var(--grn)'};
const ccol=id=>{const c=getCats().find(x=>x.id===id);return c?`var(${c.v})`:'var(--t3)'};
const today=()=>new Date().toISOString().split('T')[0];
const WEEKDAYS=['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const WEEKDAYS_FULL=['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
function ffreqLabel(t){
  if(t.freqType==='weekly'&&t.freqWeekday!=null)return'varje '+WEEKDAYS_FULL[t.freqWeekday];
  if(t.freqType==='monthly'&&t.freqMonthDay)return t.freqMonthDay+':e varje månad';
  return'var '+ffreq(t.frequencyDays||7);
}
const ffreq=d=>{d=parseInt(d);return d===1?'dag':d===7?'vecka':d===14?'annan vecka':d===30?'månad':d+':e dag'};

function sortTasks(arr){
  return[...arr].sort((a,b)=>urg(b)-urg(a));
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function R(){
  const app=document.getElementById('app');if(!app)return;
  document.documentElement.setAttribute('data-theme',S.theme);
  document.getElementById('metaTheme').content=S.theme==='dark'?'#0A0A0F':'#FFF5F7';
  if(S.onboarding>0||(S.onboarding===0&&!localStorage.getItem('puls'))){if(S.onboarding===0)S.onboarding=1;stopObAnim();app.innerHTML=rOnboarding();bind();if(S.onboarding===2)initObAnim();return}
  let html=rHeader()+rTabs();
  if(S.tab==='todos'){html+=rTodosView()}
  else{
    const all=allTasks();
    const red=all.filter(t=>urg(t)>=1).length,org=all.filter(t=>{const u=urg(t);return u>=.75&&u<1}).length,grn=all.filter(t=>urg(t)<.5).length,allOk=red===0&&org===0;
    html+=rStats(red,org,grn,allOk);
    if(S.expandedCat){html+=rCatView()}
    else{html+=rTodo()+rDivider()+rCats()}
  }
  html+=S.modal?rModal():'';
  app.innerHTML=html;bind();
}

function rTabs(){
  const all=allTasks();
  const urgN=all.filter(t=>urg(t)>=.75).length;
  const todoN=S.todos.filter(t=>!t.done).length;
  return`<div class="tabs"><button class="tab${S.tab==='pulser'?' on':''}" data-action="setTab" data-tab="pulser">⚡ Pulser${urgN?` <span class="tab-count hot">${urgN}</span>`:''}</button><button class="tab${S.tab==='todos'?' on':''}" data-action="setTab" data-tab="todos">☑ Att göra${todoN?` <span class="tab-count">${todoN}</span>`:''}</button><button class="add-btn" data-action="addTask" style="height:36px;padding:0 12px;font-size:12px;flex:0 0 auto"><span>+</span></button></div>`;
}

function rHeader(){
  let prof='';
  if(S.user){
    const anon=S.user.isAnonymous;
    const hh=S.household?'<span class="p-hh-badge">🏠</span>':'';
    prof=`<div class="profile-chip" data-action="toggleProfile">${S.user.photoURL?`<img src="${S.user.photoURL}" referrerpolicy="no-referrer">`:anon?'<span style="font-size:14px">👻</span>':'<span style="font-size:14px">👤</span>'}${hh}<div class="sync-dot ${S.syncStatus}"></div></div>`;
    if(S.profileOpen){
      const st={synced:'Synkad',syncing:'Synkar...',offline:anon?'Lokal':'Offline'}[S.syncStatus];
      const hhBtn=anon?'':(S.household?`<button class="p-btn" data-action="openHousehold">🏠 Hushåll <span class="p-hh-badge">${S.householdId}</span></button>`:`<button class="p-btn" data-action="openHousehold">🏠 Hushåll</button>`);
      const upgradeBtn=anon?`<button class="p-btn" data-action="openAuth" style="border-color:var(--acc);color:var(--acc)">🔗 Koppla konto (synka)</button>`:'';
      prof+=`<div class="profile-drop"><div class="p-name">${anon?'Anonym':S.user.displayName||'Inloggad'}</div>${!anon?`<div class="p-email">${S.user.email||''}</div>`:''}<div class="p-sync"><div class="sync-dot ${S.syncStatus}" style="width:6px;height:6px"></div> ${st}</div><div class="p-divider"></div>${upgradeBtn}${hhBtn}<button class="p-btn danger" data-action="signOut">Logga ut</button></div>`;
    }
  }else{prof=`<button class="signin-btn" data-action="openAuth">🔑 Logga in</button>`}
  return`<header class="hdr"><div class="hdr-row"><h1 class="logo"><span class="logo-z">⚡</span> PULS</h1><div class="hdr-actions"><div style="position:relative">${prof}</div><button class="icon-btn" data-action="toggleTheme">${S.theme==='dark'?'☀️':'🌙'}</button></div></div>${rVacation()}</header>`;
}
function rVacation(){
  const vt=S.tasks.find(t=>t.id==='__vacation__');if(!vt)return'';
  if(!vt.lastDone)return`<div class="vac-empty" data-action="editVacation">🏖️ Ställ in semester →</div>`;
  const ds=dsince(vt.lastDone),p=Math.min(ds/vt.frequencyDays,1),dl=Math.max(0,vt.frequencyDays-ds);
  return`<div class="vac-strip" data-action="editVacation"><span style="font-size:14px">🏖️</span><span style="font-size:11px;color:var(--t3)">Semester</span><div class="vac-prog"><div class="vac-prog-fill" style="width:${p*100}%"></div></div><span class="vac-txt">${dl===0?'🎉 Dags!':dl+'d'}</span></div>`;
}
function rOnboarding(){
  const step=S.onboarding;
  const dots=`<div class="ob-dots"><div class="ob-dot${step===1?' on':''}"></div><div class="ob-dot${step===2?' on':''}"></div><div class="ob-dot${step===3?' on':''}"></div></div>`;
  if(step===1)return`<div class="ob"><div class="ob-step"><div class="ob-icon">⚡</div><div class="ob-title">Håll koll på allt<br>som behöver göras</div><div class="ob-desc">Puls räknar dagar sedan du senast gjorde något. Siffran tickar upp — färgen hjälper dig prioritera.</div><div class="ob-demo" style="padding:0;border:none;background:none"><div class="tc u-red" style="animation:none;opacity:1"><div class="tc-days"><div class="tc-days-num" style="color:var(--red)">5</div><div class="tc-days-lbl">dagar sen</div></div><div class="tc-lamp red"></div><div class="tc-info"><div class="tc-name">Gymma</div><div class="tc-meta">💪 Fitness<span class="dot">·</span>var 2:e dag</div></div><div class="tc-actions"><button class="tc-btn check" style="pointer-events:none">✓</button></div></div></div>${dots}<button class="ob-next" data-action="obNext">Nästa →</button><button class="ob-skip" data-action="obSkip">Hoppa över</button></div></div>`;
  if(step===2)return`<div class="ob"><div class="ob-step"><div class="ob-icon">🔄</div><div class="ob-title">Sätt frekvens,<br>sen glöm det</div><div class="ob-desc">Puls håller koll åt dig och lyfter upp det när det börjar bli dags igen.</div><div id="ob-anim" style="padding:0;border:none;background:none;display:flex;flex-direction:column;gap:6px;position:relative"></div>${dots}<button class="ob-next" data-action="obNext">Nästa →</button><button class="ob-skip" data-action="obSkip">Hoppa över</button></div></div>`;
  if(step===3)return`<div class="ob"><div class="ob-step"><div class="ob-icon">🚀</div><div class="ob-title">Redo!</div><div class="ob-desc">Vi har lagt in 3 exempel-pulser åt dig. Redigera, ta bort eller lägg till egna — det är din puls.</div><div class="ob-demo" style="text-align:center"><div style="display:flex;justify-content:center;gap:16px;padding:6px 0"><div><div style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--red)">5</div><div style="font-size:10px;color:var(--t3)">Gymma</div></div><div><div style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--org)">6</div><div style="font-size:10px;color:var(--t3)">Städa</div></div><div><div style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--grn)">2</div><div style="font-size:10px;color:var(--t3)">Handla mat</div></div></div></div>${dots}<button class="ob-next" data-action="obDone">Kör igång! ⚡</button></div></div>`;
  return'';
}

// ═══════════════════════════════════════════
// ONBOARDING STEP 2 ANIMATION
// ═══════════════════════════════════════════
let _obAnimTimer=null;
function stopObAnim(){if(_obAnimTimer){clearTimeout(_obAnimTimer);_obAnimTimer=null}}
function initObAnim(){
  stopObAnim();
  const box=document.getElementById('ob-anim');if(!box)return;
  const items=[
    {id:'gym',name:'Gymma',cat:'💪 Fitness',freq:2,days:0,hero:true},
    {id:'stad',name:'Städa hemma',cat:'🏠 Hem',freq:7,days:4},
    {id:'mat',name:'Handla mat',cat:'🛒 Hem',freq:5,days:3}
  ];
  function col(d,f){const u=d/f;return u>=1?'var(--red)':u>=.75?'var(--org)':u>=.5?'var(--yel)':'var(--grn)'}
  function cls(d,f){const u=d/f;return u>=1?'u-red':u>=.75?'u-org':u>=.5?'u-yel':'u-grn'}
  function lamp(d,f){const u=d/f;return u>=1?'red':u>=.75?'org':u>=.5?'yel':'grn'}
  function renderCards(highlight){
    const sorted=[...items].sort((a,b)=>(b.days/b.freq)-(a.days/a.freq));
    const oldPos={};box.querySelectorAll('.tc[data-ob]').forEach(el=>{
      oldPos[el.dataset.ob]=el.getBoundingClientRect();
    });
    box.innerHTML=sorted.map(it=>{
      const c=col(it.days,it.freq),l=lamp(it.days,it.freq),u=cls(it.days,it.freq);
      const hl=highlight===it.id;
      return`<div class="tc ${u}" data-ob="${it.id}" style="animation:none;opacity:1;transition:transform .6s cubic-bezier(.4,0,.2,1)${hl?';box-shadow:0 0 0 2px '+c:''}"><div class="tc-days"><div class="tc-days-num" style="color:${c};transition:color .5s">${it.days}</div><div class="tc-days-lbl">dagar sen</div></div><div class="tc-lamp ${l}"></div><div class="tc-info"><div class="tc-name">${it.name}</div><div class="tc-meta">${it.cat}<span class="dot">·</span>var ${it.freq===1?'dag':it.freq+':e dag'}</div></div><div class="tc-actions"><button class="tc-btn check" style="pointer-events:none">✓</button></div></div>`;
    }).join('');
    if(Object.keys(oldPos).length){
      box.querySelectorAll('.tc[data-ob]').forEach(el=>{
        const id=el.dataset.ob;
        if(oldPos[id]){
          const newPos=el.getBoundingClientRect();
          const dy=oldPos[id].top-newPos.top;
          if(Math.abs(dy)>2){
            el.style.transform=`translateY(${dy}px)`;
            el.style.transition='none';
            requestAnimationFrame(()=>{requestAnimationFrame(()=>{
              el.style.transition='transform .6s cubic-bezier(.4,0,.2,1)';
              el.style.transform='';
            })});
          }
        }
      });
    }
  }
  // Narrative sequence: Gymma climbs from 0 to red, gets checked, drops
  renderCards();
  const steps=[
    // [delay, action]
    // Gymma ticks up: 0→1→2→3, climbing through colors
    [1200, ()=>{items[0].days=1;renderCards('gym')}],
    [1400, ()=>{items[0].days=2;renderCards('gym')}],   // hits yellow, passes Handla
    [1400, ()=>{items[0].days=3;renderCards('gym')}],   // hits red, climbs to top
    // Pause at top — let it breathe
    [2000, ()=>{
      // Flash the check button
      const card=box.querySelector('[data-ob="gym"]');
      if(card){
        const btn=card.querySelector('.tc-btn.check');
        if(btn){btn.style.background='var(--grn)';btn.style.color='#fff';btn.style.transform='scale(1.3)';btn.style.transition='all .3s'}
        card.style.boxShadow='0 0 20px rgba(81,207,102,.5)';
        card.style.transition='box-shadow .3s';
      }
    }],
    // Reset gymma → drops to bottom
    [800, ()=>{items[0].days=0;renderCards()}],
    // Meanwhile others tick up
    [1400, ()=>{items[1].days=5;items[2].days=4;renderCards()}],
    [1400, ()=>{items[1].days=6;items[2].days=5;renderCards('stad')}],  // Städa climbing
    [1400, ()=>{items[1].days=7;renderCards('stad')}],  // Städa hits orange/red
    [1800, ()=>{
      const card=box.querySelector('[data-ob="stad"]');
      if(card){
        const btn=card.querySelector('.tc-btn.check');
        if(btn){btn.style.background='var(--grn)';btn.style.color='#fff';btn.style.transform='scale(1.3)';btn.style.transition='all .3s'}
        card.style.boxShadow='0 0 20px rgba(81,207,102,.5)';
        card.style.transition='box-shadow .3s';
      }
    }],
    [800, ()=>{items[1].days=0;renderCards()}],
    // Loop: reset everything
    [2000, ()=>{items[0].days=0;items[1].days=4;items[2].days=3;renderCards();runSequence()}]
  ];
  let stepIdx=0;
  function runSequence(){
    stepIdx=0;
    nextStep();
  }
  function nextStep(){
    if(stepIdx>=steps.length)return;
    const[delay,fn]=steps[stepIdx];
    _obAnimTimer=setTimeout(()=>{fn();stepIdx++;nextStep()},delay);
  }
  runSequence();
}

function rStats(red,org,grn,allOk){
  if(allOk)return`<div class="stats-inline"><div class="all-clear">✨ Allt i fas — pulserna dyker upp igen när det börjar bli dags</div></div>`;
  let h='<div class="stats-inline">';
  if(red>0)h+=`<div class="si"><div class="si-dot" style="background:var(--red)"></div><span class="si-num red">${red}</span> gör nu</div>`;
  if(org>0)h+=`<div class="si"><div class="si-dot" style="background:var(--org)"></div><span class="si-num org">${org}</span> snart</div>`;
  h+=`<div class="si"><div class="si-dot" style="background:var(--grn)"></div><span class="si-num grn">${grn}</span> lugnt</div>`;
  return h+'</div>';
}

// ═══════════════════════════════════════════
// CARD – universal, used in both views
// ═══════════════════════════════════════════
function rCard(t,i,ctx){
  const ds=dsince(t.lastDone);
  const daysNum=ds===null?'–':ds;
  const cat=getCats().find(c=>c.id===t.category);
  const shared=isShared(t.category);
  const isExp=S.expandedTask===t.id;
  const isLifted=S.liftedToPrio.has(t.id);
  const isPrio=ctx==='prio';
  const extra=isPrio?'':'cat-card';

  let h=`<div><div class="tc ${urgCls(t)} ${extra}${shared?' shared':''}" style="animation-delay:${i*.03}s">`;
  // THE number: days since
  h+=`<div class="tc-days"><div class="tc-days-num" style="color:${dayCol(t)}">${daysNum}</div><div class="tc-days-lbl">dagar sen</div></div>`;
  // Signal lamp
  h+=`<div class="tc-lamp ${lampCls(t)}"></div>`;
  // Info
  h+=`<div class="tc-info" data-action="toggleTask" data-id="${t.id}"><div class="tc-name">${t.name}${isLifted&&!isPrio?' <span class="prio-pin">📌</span>':''}${shared?' <span class="shared-tag">👥</span>':''}</div><div class="tc-meta">${cat?cat.icon+' '+cat.label:''}<span class="dot">·</span>${ffreqLabel(t)}</div></div>`;
  // Actions
  h+=`<div class="tc-actions">`;
  if(isPrio)h+=`<span style="font-size:10px;color:var(--tm);cursor:pointer;white-space:nowrap" data-action="hideToday" data-id="${t.id}">dölj</span>`;
  else h+=`<button class="tc-btn" data-action="${isLifted?'unliftPrio':'liftPrio'}" data-id="${t.id}">${isLifted?'📌':'↑'}</button>`;
  h+=`<button class="tc-btn check" data-action="checkTask" data-id="${t.id}">✓</button></div></div>`;
  // Expanded
  if(isExp){
    h+=`<div class="tc-expand"><button class="tc-expand-btn" data-action="editTask" data-id="${t.id}">✏️ Redigera</button><button class="tc-expand-btn" data-action="pickDate" data-id="${t.id}">📅 Datum</button>${!t.isProtected?`<button class="tc-expand-btn del" data-action="deleteTask" data-id="${t.id}">🗑</button>`:''}</div>`;
    if(S.datePicking===t.id)h+=`<div class="date-pick"><input type="date" id="dp-${t.id}" value="${today()}" max="${today()}"><button style="background:var(--acc);color:#fff" data-action="confirmDate" data-id="${t.id}">Spara</button><button style="background:var(--bg2);color:var(--t2);border:1px solid var(--brd)" data-action="cancelDate">Avbryt</button></div>`;
  }
  return h+'</div>';
}

function rCats(){

function rCatView(){
  const cat=getCats().find(c=>c.id===S.expandedCat);if(!cat)return'';

// MODALS
// ═══════════════════════════════════════════

// TODOS VIEW – one-off tasks
// ═══════════════════════════════════════════
function rTodosView(){
  const all=S.todos;
  let h='';
  const allGroups=[...new Set([...(S.todoGroups||[]),...all.map(x=>x.group).filter(Boolean)])];
  let idx=0;
  // New project input at top
  h+=`<div class="todo-quick-add" style="margin-bottom:10px"><input class="todo-quick-input" id="new-project-input" placeholder="+ Nytt ämne..." style="border-style:dashed" data-action-enter="quickAddProject"></div>`;
  // Groups
  for(const gname of allGroups){
    const gAll=all.filter(t=>t.group===gname);
    const gPending=gAll.filter(t=>!t.done);
    const gDone=gAll.filter(t=>t.done);
    const total=gAll.length,doneN=gDone.length;
    const pct=total>0?Math.round(doneN/total*100):0;
    const allComplete=total>0&&doneN===total;
    const collapsed=!!S.collapsedGroups[gname];
    const pendingN=gPending.length;
    h+=`<div class="todo-group"><div class="todo-group-hdr" data-action="toggleGroup" data-gname="${gname}"><span style="font-size:10px;color:var(--tm);margin-right:2px">${collapsed?'▸':'▾'}</span><div class="todo-group-name"${allComplete?' style="color:var(--grn)"':''}>${allComplete?'✓ ':''}${gname}</div>${total>0?`<span class="todo-group-count">${collapsed&&pendingN>0?pendingN+' kvar · ':''}${doneN}/${total}</span><div class="todo-group-prog"><div class="todo-group-prog-fill" style="width:${pct}%${allComplete?';background:var(--grn)':''}"></div></div>`:''}</div>`;
    if(!collapsed){
      gPending.forEach(t=>{h+=rTodoCard(t,idx++,false)});
      if(allComplete&&gDone.length){h+=`<div style="font-size:11px;color:var(--t3);padding:4px 0 2px;text-align:center">🎉 Klart!</div>`}
      if(gDone.length){gDone.forEach(t=>{h+=rTodoCard(t,idx++,true)})}
      h+=`<div class="todo-quick-add"><input class="todo-quick-input" data-group="${gname}" placeholder="+ Lägg till..." data-action-enter="quickAddTodo"></div>`;
    }
    h+=`</div>`;
  }
  if(!allGroups.length){h+=`<div style="text-align:center;padding:30px 0;color:var(--tm);font-size:13px">Skapa ditt första ämne ovan</div>`}
  return h;
}

function rTodoCard(t,i,isDone){
  const ds=t.dueDate?Math.floor((new Date(t.dueDate)-new Date())/864e5):null;
  const overdue=ds!==null&&ds<0&&!isDone;
  let due='';
  if(t.dueDate){
    const label=ds===0?'Idag':ds===1?'Imorgon':ds===-1?'Igår':ds<0?Math.abs(ds)+' dagar sen':ds+' dagar';
    due=`<div class="todo-due${overdue?' overdue':''}">📅 ${label}</div>`;
  }
  const calBtn=t.dueDate&&!isDone?`<button class="todo-del" data-action="pushCal" data-id="${t.id}" title="Google Kalender" style="color:var(--t3);font-size:11px">📅</button>`:'';
  const grip=!isDone?`<div class="todo-grip" data-drag-handle>⠿</div>`:'';
  return`<div class="todo-card${isDone?' done':''}" data-todo-id="${t.id}" style="animation-delay:${i*.03}s">${grip}<button class="todo-check${isDone?' checked':''}" data-action="toggleTodo" data-id="${t.id}">${isDone?'✓':''}</button><div class="todo-info" data-action="editTodo" data-id="${t.id}"><div class="todo-name">${t.name}</div>${t.note?`<div class="todo-note">${t.note}</div>`:''}${due}</div>${calBtn}<button class="todo-del" data-action="deleteTodo" data-id="${t.id}">✕</button></div>`;
}

// EVENTS

// ═══════════════════════════════════════════
// DRAG & DROP (todos only, touch + mouse)
// ═══════════════════════════════════════════
let _drag=null;
function initDrag(){
  document.querySelectorAll('[data-drag-handle]').forEach(grip=>{
    grip.addEventListener('pointerdown',dragStart);
  });
}
function dragStart(e){
  const card=e.target.closest('.todo-card');if(!card)return;
  const id=card.dataset.todoId;if(!id)return;
  e.preventDefault();
  const rect=card.getBoundingClientRect();
  // Create ghost
  const ghost=card.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width=rect.width+'px';
  ghost.style.left=rect.left+'px';
  ghost.style.top=rect.top+'px';
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  _drag={id,ghost,startY:e.clientY,offsetY:e.clientY-rect.top,srcCard:card};
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragEnd);
}
function dragMove(e){
  if(!_drag)return;
  e.preventDefault();
  _drag.ghost.style.top=(e.clientY-_drag.offsetY)+'px';
  // Find drop target
  document.querySelectorAll('.todo-card.drag-over-above,.todo-card.drag-over-below').forEach(c=>c.classList.remove('drag-over-above','drag-over-below'));
  const cards=[...document.querySelectorAll('.todo-card:not(.dragging):not(.done)')];
  let closest=null,closestDist=Infinity,above=true;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    const mid=r.top+r.height/2;
    const dist=Math.abs(e.clientY-mid);
    if(dist<closestDist){closestDist=dist;closest=c;above=e.clientY<mid}
  }
  if(closest){closest.classList.add(above?'drag-over-above':'drag-over-below');_drag.target=closest;_drag.above=above}
}
function dragEnd(e){
  if(!_drag)return;
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragEnd);
  document.querySelectorAll('.drag-over-above,.drag-over-below').forEach(c=>c.classList.remove('drag-over-above','drag-over-below'));
  _drag.srcCard.classList.remove('dragging');
  _drag.ghost.remove();
  // Apply reorder
  if(_drag.target){
    const fromId=_drag.id;
    const toId=_drag.target.dataset.todoId;
    if(fromId&&toId&&fromId!==toId){
      const fi=S.todos.findIndex(t=>t.id===fromId);
      if(fi>=0){
        const item=S.todos.splice(fi,1)[0];
        // Also adopt target's group
        const targetTodo=S.todos.find(t=>t.id===toId);
        if(targetTodo)item.group=targetTodo.group||null;
        let ti=S.todos.findIndex(t=>t.id===toId);
        if(ti>=0){
          if(!_drag.above)ti++;
          S.todos.splice(ti,0,item);
        }else{S.todos.push(item)}
        save();R();
      }
    }
  }
  _drag=null;
}

function bind(){
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',H));
  const fi=document.getElementById('tf');
  if(fi)fi.addEventListener('input',()=>{const h=fi.closest('.fg')?.querySelector('.fh');if(h)h.textContent='= var '+ffreq(fi.value||'7');document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('sel',b.dataset.freq===fi.value))});
  const af=document.querySelector('[autofocus]');if(af)setTimeout(()=>af.focus(),50);
  document.addEventListener('click',e=>{if(S.profileOpen&&!e.target.closest('.profile-chip')&&!e.target.closest('.profile-drop')){S.profileOpen=false;R()}},{once:true});
  if(S.tab==='todos'){
    initDrag();
    document.querySelectorAll('.todo-quick-input').forEach(inp=>{
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          const name=inp.value.trim();if(!name)return;
          const action=inp.dataset.actionEnter;
          if(action==='quickAddProject'){
            // Create group by adding first todo placeholder — or just track group
            if(!S.todoGroups)S.todoGroups=[];
            if(!S.todoGroups.includes(name)){S.todoGroups.push(name)}
            save();R();
            // Focus the new group's quick-add input
            setTimeout(()=>{const ni=document.querySelector(`.todo-quick-input[data-group="${name}"]`);if(ni)ni.focus()},60);
          }else{
            const group=inp.dataset.group||null;
            S.todos.push({id:gid(),name,group:group||null,note:'',dueDate:null,done:false,doneAt:null,createdAt:new Date().toISOString()});
            save();R();
            setTimeout(()=>{const ni=document.querySelector(`.todo-quick-input[data-group="${group||''}"]`);if(ni)ni.focus()},60);
          }
        }
      });
    });
  }
}

function H(e){
  const el=e.currentTarget,a=el.dataset.action;
  switch(a){
    case 'toggleTheme':S.theme=S.theme==='dark'?'light':'dark';save();R();break;
    case 'toggleProfile':e.stopPropagation();S.profileOpen=!S.profileOpen;R();break;
    case 'openAuth':S.modal={type:'auth'};S.profileOpen=false;pNav();R();break;
    case 'signInGoogle':S.modal=null;R();authWithProvider(gProv);break;
    case 'signInAnon':S.modal=null;R();anonSignIn();break;
    case 'signOut':doSignOut();break;
    case 'addTask':S.modal={type:S.tab==='todos'?'todo':'task'};pNav();R();break;
    case 'setTab':S.tab=el.dataset.tab;S.expandedCat=null;S.expandedTask=null;R();break;
    case 'toggleCats':S.showCats=!S.showCats;R();break;
    case 'expandCat':S.expandedCat=el.dataset.cat;S.datePicking=null;S.expandedTask=null;pNav();R();break;
    case 'collapseCat':S.expandedCat=null;S.datePicking=null;S.expandedTask=null;R();break;
    case 'toggleTask':S.expandedTask=S.expandedTask===el.dataset.id?null:el.dataset.id;S.datePicking=null;R();break;
    case 'hideToday':e.stopPropagation();S.hiddenToday[el.dataset.id]=today();S.expandedTask=null;save();R();break;
    case 'liftPrio':e.stopPropagation();S.liftedToPrio.add(el.dataset.id);delete S.hiddenToday[el.dataset.id];S.expandedTask=null;R();break;
    case 'unliftPrio':e.stopPropagation();S.liftedToPrio.delete(el.dataset.id);S.expandedTask=null;R();break;
    case 'checkTask':{e.stopPropagation();const f=findTask(el.dataset.id);if(f){f.task.lastDone=new Date().toISOString();delete S.hiddenToday[f.task.id];S.liftedToPrio.delete(f.task.id);S.expandedTask=null;el.classList.add('pop');save();setTimeout(R,450)}break}
    case 'pickDate':e.stopPropagation();S.datePicking=S.datePicking===el.dataset.id?null:el.dataset.id;R();break;
    case 'confirmDate':{const inp=document.getElementById('dp-'+el.dataset.id);if(inp?.value){const f=findTask(el.dataset.id);if(f){f.task.lastDone=new Date(inp.value+'T12:00:00').toISOString();S.datePicking=null;S.expandedTask=null;delete S.hiddenToday[f.task.id];save();R()}}break}
    case 'cancelDate':S.datePicking=null;R();break;
    case 'editTask':{e.stopPropagation();const f=findTask(el.dataset.id);if(f){S.modal={type:'task',task:{...f.task},source:f.src};S.expandedTask=null;pNav();R()}break}
    case 'closeModal':S.modal=null;R();break;
    case 'editVacation':S.modal={type:'vacation'};pNav();R();break;
    case 'saveVacation':{const f=parseInt(document.getElementById('vf').value)||90,ld=document.getElementById('vl').value;let vt=S.tasks.find(t=>t.id==='__vacation__');if(!vt){vt={...VTASK};S.tasks.push(vt)}vt.frequencyDays=f;vt.lastDone=ld?new Date(ld+'T12:00:00').toISOString():new Date().toISOString();S.modal=null;save();R();break}
    case 'setCat':{document.querySelectorAll('.co').forEach(b=>{b.classList.remove('sel');b.removeAttribute('style')});el.classList.add('sel');el.style.cssText=`border-color:${ccol(el.dataset.cat)};color:${ccol(el.dataset.cat)};font-weight:600`;document.getElementById('catGrid').dataset.selected=el.dataset.cat;break}
    case 'setFreq':{const f=el.dataset.freq;document.getElementById('tf').value=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');const h=el.closest('.fg')?.querySelector('.fh');if(h)h.textContent='= var '+ffreq(f);break}
    case 'setFreqType':{const ft=el.dataset.ft;if(!S.modal.task)S.modal.task={};S.modal.task.freqType=ft;R();break}
    case 'setWeekday':{if(!S.modal.task)S.modal.task={};S.modal.task.freqWeekday=parseInt(el.dataset.wd);document.querySelectorAll('.wd-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');break}
    case 'setMonthDay':{if(!S.modal.task)S.modal.task={};S.modal.task.freqMonthDay=parseInt(el.dataset.md);document.querySelectorAll('.md-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');break}
    case 'setAssign':{if(S.modal?.task)S.modal.task.assignedTo=el.dataset.uid||null;document.querySelectorAll('.assign-opt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');break}
    case 'addCategory':{const inp=document.getElementById('new-cat-name');const name=inp?.value?.trim();if(!name)return;const id=name.toLowerCase().replace(/[^a-zåäö0-9]/g,'_');if(getCats().find(c=>c.id===id))return;const emoji=EMOJI_POOL[S.customCats.length%EMOJI_POOL.length];S.customCats.push({id,label:name,icon:emoji,v:'--c-oth'});save();R();break}
    case 'saveTask':{
      const ne=document.getElementById('tn'),fe=document.getElementById('tf');
      const sc=document.getElementById('catGrid')?.dataset.selected||document.querySelector('.co.sel')?.dataset.cat||S.expandedCat||'content';
      const n=ne?.value?.trim();if(!n){ne?.focus();return}const freq=Math.max(1,parseInt(fe?.value)||7);
      const shared=isShared(sc);
      const mt=S.modal.task||{};
      const freqType=mt.freqType||'days';
      const freqWeekday=mt.freqWeekday!=null?mt.freqWeekday:null;
      const freqMonthDay=mt.freqMonthDay||null;
      if(mt.id){
        const f=findTask(mt.id);if(f){const t=f.task;const was=f.src==='h';const now=shared;
          t.name=n;t.category=sc;t.frequencyDays=freq;
          t.freqType=freqType;t.freqWeekday=freqWeekday;t.freqMonthDay=freqMonthDay;
          if(mt.assignedTo!==undefined)t.assignedTo=mt.assignedTo;
          const lde=document.getElementById('tl');if(lde?.value)t.lastDone=new Date(lde.value+'T12:00:00').toISOString();else if(lde&&!lde.value)t.lastDone=null;
          if(!was&&now&&S.household){S.tasks=S.tasks.filter(x=>x.id!==t.id);S.household.tasks.push(t)}
          else if(was&&!now&&S.household){S.household.tasks=S.household.tasks.filter(x=>x.id!==t.id);S.tasks.push(t)}
        }
      }else{const nt={id:gid(),name:n,category:sc,frequencyDays:freq,freqType,freqWeekday,freqMonthDay,lastDone:null,assignedTo:null};if(shared&&S.household)S.household.tasks.push(nt);else S.tasks.push(nt)}
      S.modal=null;save();R();break}
    case 'deleteTask':S.modal={type:'confirm',taskId:el.dataset.id};R();break;
    case 'confirmDelete':{const id=el.dataset.id;S.tasks=S.tasks.filter(t=>t.id!==id);if(S.household)S.household.tasks=(S.household.tasks||[]).filter(t=>t.id!==id);S.modal=null;save();R();break}
    case 'openHousehold':S.profileOpen=false;S.modal={type:'household'};pNav();R();break;
    case 'createHousehold':createHH().then(()=>R());break;
    case 'joinHousehold':{const inp=document.getElementById('hh-code-input');const err=document.getElementById('hh-error');if(inp?.value)joinHH(inp.value).then(ok=>{if(!ok&&err)err.style.display='block';else{S.modal={type:'household'};R()}});break}
    case 'leaveHousehold':leaveHH().then(()=>{S.modal=null;R()});break;
    case 'toggleSharedCat':toggleSharedCat(el.dataset.cat);break;
    // ─── Onboarding ───
    case 'obNext':stopObAnim();S.onboarding++;R();break;
    case 'obSkip':case 'obDone':stopObAnim();S.onboarding=-1;save();R();break;
    // ─── Todo actions ───
    case 'toggleTodo':{e.stopPropagation();const t=S.todos.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;save();R()}break}
    case 'editTodo':{const t=S.todos.find(x=>x.id===el.dataset.id);if(t){S.modal={type:'todo',todo:{...t}};pNav();R()}break}
    case 'deleteTodo':{e.stopPropagation();S.todos=S.todos.filter(x=>x.id!==el.dataset.id);save();R();break}
    case 'deleteTodoConfirm':{S.todos=S.todos.filter(x=>x.id!==el.dataset.id);S.modal=null;save();R();break}
    case 'saveTodo':{
      const n=document.getElementById('todo-name')?.value?.trim();if(!n)return;
      const note=document.getElementById('todo-note')?.value?.trim()||'';
      const due=document.getElementById('todo-due')?.value||'';
      const newGroup=document.getElementById('todo-group-new')?.value?.trim()||'';
      const selGroup=document.querySelector('.todo-group-opt.sel')?.dataset.group;
      const group=newGroup||selGroup||null;
      if(S.modal.todo?.id){const t=S.todos.find(x=>x.id===S.modal.todo.id);if(t){t.name=n;t.note=note;t.dueDate=due||null;t.group=group}}
      else{S.todos.push({id:gid(),name:n,note,group,dueDate:due||null,done:false,doneAt:null,createdAt:new Date().toISOString()})}
      S.modal=null;save();R();break}
    case 'setTodoGroup':{document.querySelectorAll('.todo-group-opt').forEach(b=>{b.classList.remove('sel');b.style.cssText=''});el.classList.add('sel');el.style.cssText='border-color:var(--acc);color:var(--acc);font-weight:600';const inp=document.getElementById('todo-group-new');if(inp)inp.value='';break}
    case 'toggleShowDone':S.showDone=!S.showDone;R();break;
    case 'toggleGroup':{const g=el.dataset.gname;if(S.collapsedGroups[g])delete S.collapsedGroups[g];else S.collapsedGroups[g]=true;R();break}
    case 'pushCal':{e.stopPropagation();const t=S.todos.find(x=>x.id===el.dataset.id);if(t&&t.dueDate){const d=t.dueDate.replace(/-/g,'');const next=new Date(t.dueDate);next.setDate(next.getDate()+1);const d2=next.toISOString().split('T')[0].replace(/-/g,'');const title=encodeURIComponent((t.group?t.group+': ':'')+t.name);const details=encodeURIComponent(t.note||'');const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${d2}&details=${details}`;window.open(url,'_blank')}break}
  }
}

function pNav(){history.pushState({},'');}
window.addEventListener('popstate',()=>{if(S.modal){S.modal=null;R()}else if(S.expandedCat){S.expandedCat=null;S.datePicking=null;S.expandedTask=null;R()}});

document.addEventListener('DOMContentLoaded',()=>{
  loadLocal();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  R();
});
</script>
